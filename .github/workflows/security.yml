name: Security and Supply Chain (before_patch)

# CI gate applied to the VULNERABLE baseline (before_patch branch).
# This branch reflects the pre-remediation state, so the gate is expected to FAIL
# on HIGH/CRITICAL — exactly the evidence that the gate works. The same workflow
# passes on main after remediation.

on:
  push:
    branches:
      - before_patch
  pull_request:
    branches:
      - before_patch
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit pytest

      - name: Audit Python dependencies (SCA)
        run: python -m pip_audit -r requirements.txt
        continue-on-error: true

      - name: Run Semgrep (SAST)
        working-directory: .
        run: |
          python -m pip install semgrep
          semgrep scan --config p/python --config p/flask --config p/dockerfile \
            --error starter-app
        continue-on-error: true

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container
        working-directory: .
        run: docker build --pull --tag notevault:${{ github.sha }} starter-app

      # THE GATE: fail the build on any HIGH/CRITICAL finding.
      - name: Scan container (SCA gate — HIGH/CRITICAL fails the build)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: notevault:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
